<h2><font color="#1565c0"><b>命名标记 (Named Markers)</b></font></h2>
<table width="100%" cellpadding="6" cellspacing="0" border="1" bordercolor="#cbd5e1">
<tr bgcolor="#e8eef5"><th><b>操作</b></th><th><b>说明</b></th></tr>
<tr><td>Shift + 点击波形</td><td>在点击处放置标记</td></tr>
<tr bgcolor="#f8fafc"><td>Alt+H</td><td>在播放头放置标记</td></tr>
<tr><td>Shift + 拖动标记</td><td>移动标记（未锁定时）</td></tr>
<tr bgcolor="#f8fafc"><td>B</td><td>复制主标记到 B 标记</td></tr>
<tr><td>Shift+Alt+M</td><td>删除主标记</td></tr>
</table>
<br/>

<h2><font color="#1565c0"><b>A/B 测量 (Primary Marker)</b></font></h2>
<p><b>Ctrl + 左键拖动</b> 设置 A、B 两点，显示 <font face="Consolas" bgcolor="#e2e8f0">ΔT</font> 时间差。</p>
<p><font face="Consolas" bgcolor="#e2e8f0">Esc</font> 清除测量标记。</p>

<h2><font color="#1565c0"><b>Measure 菜单</b></font></h2>
<p>Measure → Show Measurement：查看与测量模式相关的频率/占空比等信息。</p>

</font>
